server {
    listen 8080;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    root /app;
    index index.html;

    # 1. Driver Mobile APK Direct Download Endpoint
    location /download/FleetSentinel-Driver.apk {
        alias /app/mobile/FleetSentinel-Driver.apk;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="FleetSentinel-Driver.apk"';
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header Access-Control-Allow-Origin "*";
    }

    # 2. Real-Time Socket.io Gateway
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 3. FastAPI SSE Streaming, Telemetry & Compliance Routes
    location ~ ^/api/v1/(reports|email|sms|driver|stream|telemetry|fleet/(dispatch|units|alerts|purge-demo|provision)) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 4. Node.js REST API & Ingress Routes
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Frontend Cockpit Web Application
    location / {
        try_files $uri $uri/ /index.html;
    }
}
